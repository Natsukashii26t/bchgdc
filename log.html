<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ECHOES</title>
    <link rel="stylesheet" href="cssec.css">
</head>
<body>
    <header class="header">
        <a href="portada.html" class="logo">ECHOES<span>.</span></a>
        <a href="reg.html">Crear cuenta</a>
    </header>
    <main class="auth-container">
        <div class="auth-card">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Qué bueno verte.</h1>
            <p class="muted">Vuelve a conectar con la comunidad.</p>
            <form id="login-form">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Tu contraseña">
                <p id="auth-message" class="message"></p>
                <button type="submit" class="button full-button">
                    Iniciar sesión
                </button>
            </form>
            <p class="auth-switch">
                ¿Todavía no tienes cuenta?
                <a href="reg.html">Regístrate</a>
            </p>
        </div>
    </main>
    <script src="regsses.js"></script>
</body>
</html>
